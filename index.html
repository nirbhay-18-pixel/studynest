<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyNest — organize your syllabus, track study sessions, build streaks and reach your goals." />
    <title>StudyNest — Study Planner & Tracker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F5B46'/%3E%3Cpath d='M8 17c0 4 3.6 6.5 8 6.5s8-2.5 8-6.5' fill='none' stroke='%23F4E9C8' stroke-width='2.2' stroke-linecap='round'/%3E%3Cellipse cx='16' cy='13.5' rx='4.2' ry='5.2' fill='%23F4E9C8'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = JSON.parse(localStorage.getItem("sn.theme") || "null");
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
